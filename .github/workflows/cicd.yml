name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ fromJson(secrets.STORAGE_CREDENTIALS).aws_access_key_id }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ fromJson(secrets.STORAGE_CREDENTIALS).aws_secret_access_key }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=ap-southeast-2" >> $GITHUB_ENV
      - name: Pull data with DVC
        run: dvc pull
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          f1_val=$(python -c 'import json; print(json.load(open("outputs/report.json"))["f1_score"])')
          echo "f1=$f1_val" >> $GITHUB_OUTPUT
      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import boto3, os
          s3 = boto3.client('s3')
          bucket = os.environ.get("ARTIFACT_BUCKET")
          if bucket:
              s3.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
              print(f"Uploaded to s3://{bucket}/artifacts/current/model.joblib")
          else:
              print("Warning: ARTIFACT_BUCKET is not set.")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys
          f1_str = "${{ needs.train.outputs.f1 }}"
          if not f1_str:
              print("F1 score output is missing!")
              sys.exit(1)
          f1 = float(f1_str)
          if f1 < 0.65:
              print(f"Quality gate failed: f1_score {f1} < 0.65")
              sys.exit(1)
          else:
              print(f"Quality gate passed: f1_score {f1} >= 0.65")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -f http://localhost:8080/healthz || exit 1
